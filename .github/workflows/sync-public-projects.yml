name: Build site content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/build-content.mjs"
      - ".github/workflows/sync-public-projects.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: build-site-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build Markdown content and sync public repositories
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html en/index.html \
            projects en/projects \
            blog en/blog \
            notes en/notes \
            lab en/lab \
            about en/about \
            resume en/resume \
            toolbox en/toolbox \
            resources en/resources \
            contact en/contact \
            wechat en/wechat \
            privacy en/privacy \
            offline en/offline \
            assets/data/search-index.json assets/data/search-index.en.json \
            feed.xml rss.xml en/feed.xml en/rss.xml \
            sitemap.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync public project visibility"
          git push
